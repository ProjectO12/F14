<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Teddy Day – Iswarya</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-solid-straight/css/uicons-solid-straight.css'>
<link rel="stylesheet" href="styles/four.css">
</head>
<body>

<div class="valentine-stepper" id="stepper">
    <div class="step">
        <div class="circle active"><i class="fi fi-ss-rose"></i></div>
        <span></span>
        <div class="bar"><div class="fill"></div></div>
    </div>

    <div class="step">
        <div class="circle"><i class="fi fi-ss-ring-diamond"></i></div>
        <span></span>
        <div class="bar"><div class="fill"></div></div>
    </div>

    <div class="step">
        <div class="circle"><i class="fi fi-ss-candy-bar"></i></div>
        <span></span>
        <div class="bar"><div class="fill"></div></div>
    </div>

    <div class="step">
        <div class="circle"><i class="fi fi-ss-teddy-bear"></i></div>
        <span></span>
        <div class="bar"><div class="fill"></div></div>
    </div>

    <div class="step">
        <div class="circle"><i class="fi fi-ss-heart-partner-handshake"></i></div>
        <span></span>
        <div class="bar"><div class="fill"></div></div>
    </div>

    <div class="step">
        <div class="circle"><i class="fi fi-ss-users"></i></div>
        <span></span>
        <div class="bar"><div class="fill"></div></div>
    </div>

    <div class="step last">
        <div class="circle"><i class="fi fi-ss-life"></i></div>
        <span></span>
    </div>
</div>

<div class="slide">

    <div class="card">

        <div class="title">
            Hi Iswarya 🧸
        </div>

        <div class="subtitle">
            Hold the teddy for a few seconds
        </div>

        <div class="teddy-wrap" id="teddyWrap">
            <div class="teddy"><img src="media/teddy-bear.png"></div>

            <div class="hug-ring">
                <div class="hug-fill" id="hugFill"></div>
            </div>
        </div>

        <div class="hint" id="hint">
            Press and hold
        </div>

        <div class="message" id="message">
            I hope this hug makes your mind feel a little lighter today.<br>
            — Charan
        </div>

    </div>

</div>

<script src="scripts/four.js"></script>
</body>
</html>
