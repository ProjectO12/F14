<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Hug Day – Iswarya</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles/six.css">
<link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-solid-straight/css/uicons-solid-straight.css'>
</head>
<body>

<div class="valentine-stepper" id="stepper">
    <div class="step">
        <div class="circle active"><a href="one.html"><i class="fi fi-ss-rose"></i></a></div>
        <span></span>
        <div class="bar"><div class="fill"></div></div>
    </div>

    <div class="step">
        <div class="circle"><a href="two.html"><i class="fi fi-ss-ring-diamond"></i></a></div>
        <span></span>
        <div class="bar"><div class="fill"></div></div>
    </div>

    <div class="step">
        <div class="circle"><a href="three.html"><i class="fi fi-ss-candy-bar"></i></a></div>
        <span></span>
        <div class="bar"><div class="fill"></div></div>
    </div>

    <div class="step">
        <div class="circle"><a href="four.html"><i class="fi fi-ss-teddy-bear"></i></a></div>
        <span></span>
        <div class="bar"><div class="fill"></div></div>
    </div>

    <div class="step">
        <div class="circle"><a href="five.html"><i class="fi fi-ss-heart-partner-handshake"></i></a></div>
        <span></span>
        <div class="bar"><div class="fill"></div></div>
    </div>

    <div class="step">
        <div class="circle"><a href="six.html"><i class="fi fi-ss-users"></i></a></div>
        <span></span>
        <div class="bar"><div class="fill"></div></div>
    </div>

    <div class="step last">
        <div class="circle"><a href="seven.html"><i class="fi fi-ss-life"></i></a></div>
        <span></span>
    </div>
</div>

<div class="slide">

    <div class="card">

        <div class="title">
            Hi 
        </div>

        <div class="presence-area" id="presenceArea">
            <div class="presence-dot" id="presenceDot"></div>
        </div>

        <div class="hint" id="hint">
            Hold the light for a moment.
            It tells me you’re here with me.
            When we both hold it, the light stays warm.

        </div>

        <div class="message" id="message">
            We showed up for each other today. 🤍<br>
            — Charan
        </div>


    </div>

</div>

<script src="scripts/six.js"></script>
<script type="module" src="scripts/six-firebase.js"></script>

</body>
</html>
