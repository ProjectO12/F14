<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chocolate Day – Iswarya</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-solid-straight/css/uicons-solid-straight.css'>
<link rel="stylesheet" href="styles/three.css">
</head>
<body>

<div class="valentine-stepper" id="stepper">
    <div class="step">
        <div class="circle active"><i class="fi fi-ss-rose"></i></div>
        <span></span>
        <div class="bar"><div class="fill"></div></div>
    </div>

    <div class="step">
        <div class="circle"><i class="fi fi-ss-ring-diamond"></i></div>
        <span></span>
        <div class="bar"><div class="fill"></div></div>
    </div>

    <div class="step">
        <div class="circle"><i class="fi fi-ss-candy-bar"></i></div>
        <span></span>
        <div class="bar"><div class="fill"></div></div>
    </div>

    <div class="step">
        <div class="circle"><i class="fi fi-ss-teddy-bear"></i></div>
        <span></span>
        <div class="bar"><div class="fill"></div></div>
    </div>

    <div class="step">
        <div class="circle"><i class="fi fi-ss-heart-partner-handshake"></i></div>
        <span></span>
        <div class="bar"><div class="fill"></div></div>
    </div>

    <div class="step">
        <div class="circle"><i class="fi fi-ss-users"></i></div>
        <span></span>
        <div class="bar"><div class="fill"></div></div>
    </div>

    <div class="step last">
        <div class="circle"><i class="fi fi-ss-life"></i></div>
        <span></span>
    </div>
</div>

<!-- chocolate fill layer -->
<div class="choco-bg" id="chocoBg"></div>

<section class="slide-section" id="slideSection">

    <div class="slide-card">
        <span class="emoji">🍫</span>
        <div class="text">A chocolate for every small smile you give me.</div>
    </div>

    <div class="slide-card">
        <span class="emoji">🍫</span>
        <div class="text">A chocolate for making college life feel lighter.</div>
    </div>

    <div class="slide-card">
        <span class="emoji">🍫</span>
        <div class="text">A chocolate for listening to my silly stories patiently.</div>
    </div>

    <div class="slide-card">
        <span class="emoji">🍫</span>
        <div class="text">(You will add your special moment here later 🌱)</div>
    </div>

    <div class="slide-card">
        <span class="emoji">🍫</span>
        <div class="text">(You will add another memory here later 💛)</div>
    </div>

</section>

<script src="scripts/three.js"></script>
</body>
</html>
